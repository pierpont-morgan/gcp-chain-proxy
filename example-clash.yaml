# Clash Verge Rev / Mihomo 多前置高可用集群配置示例
port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info

proxies:
  # === 1. 机场前置节点池（可添加多个不同区域前置） ===
  - name: '🇺🇸 美国硅谷前置'
    type: socks5
    server: your-airport-sv.com
    port: 443
    tls: true
    username: your-username
    password: your-password

  - name: '🇺🇸 美国硅谷3'
    type: http
    server: your-airport-sv3.com
    port: 443
    tls: true
    username: your-username
    password: your-password

  - name: '🇺🇸 美国洛杉矶2'
    type: http
    server: your-airport-la2.com
    port: 443
    tls: true
    username: your-username
    password: your-password

  - name: '🇯🇵 日本前置'
    type: http
    server: your-airport-jp.com
    port: 443
    tls: true
    username: your-username
    password: your-password

  # === 2. GCP 链式落地节点（分别挂接不同前置） ===
  - name: '🚀 GCP-(经硅谷专线)'
    type: vmess
    server: 35.212.xxx.xxx
    port: 8443
    uuid: your-uuid-here
    alterId: 0
    cipher: auto
    network: ws
    ws-opts: { path: /gcp-ws }
    dialer-proxy: '🇺🇸 美国硅谷前置'

  - name: '🚀 GCP-(经硅谷3)'
    type: vmess
    server: 35.212.xxx.xxx
    port: 8443
    uuid: your-uuid-here
    alterId: 0
    cipher: auto
    network: ws
    ws-opts: { path: /gcp-ws }
    dialer-proxy: '🇺🇸 美国硅谷3'

  - name: '🚀 GCP-(经洛杉矶2)'
    type: vmess
    server: 35.212.xxx.xxx
    port: 8443
    uuid: your-uuid-here
    alterId: 0
    cipher: auto
    network: ws
    ws-opts: { path: /gcp-ws }
    dialer-proxy: '🇺🇸 美国洛杉矶2'

  - name: '🚀 GCP-(经日本)'
    type: vmess
    server: 35.212.xxx.xxx
    port: 8443
    uuid: your-uuid-here
    alterId: 0
    cipher: auto
    network: ws
    ws-opts: { path: /gcp-ws }
    dialer-proxy: '🇯🇵 日本前置'

proxy-groups:
  # 主控制策略组（支持手动切换）
  - name: 'PROXIES'
    type: select
    proxies:
      - '⚡ GCP-自动优选'
      - '🛡️ GCP-故障转移'
      - '🚀 GCP-(经硅谷专线)'
      - '🚀 GCP-(经硅谷3)'
      - '🚀 GCP-(经洛杉矶2)'
      - '🚀 GCP-(经日本)'
      - DIRECT

  # 策略组 1：自动测速优选（哪条前置低延迟就自动走哪条）
  - name: '⚡ GCP-自动优选'
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - '🚀 GCP-(经硅谷专线)'
      - '🚀 GCP-(经硅谷3)'
      - '🚀 GCP-(经洛杉矶2)'
      - '🚀 GCP-(经日本)'

  # 策略组 2：故障转移（主力前置故障自动切备用）
  - name: '🛡️ GCP-故障转移'
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 120
    proxies:
      - '🚀 GCP-(经硅谷专线)'
      - '🚀 GCP-(经硅谷3)'
      - '🚀 GCP-(经洛杉矶2)'
      - '🚀 GCP-(经日本)'

rules:
  - MATCH,PROXIES
